<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Presupuesto</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <meta name="theme-color" content="#0d0f17" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=5" />
</head>
<body>
  <div class="app">
    <!-- Barra lateral -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">💰</div>
        <div>
          <div class="brand-name">Mi Presupuesto</div>
          <div class="brand-sub" id="brandSub">Control de finanzas</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="resumen"><span class="nav-ico">📊</span><span>Resumen</span></button>
        <button class="nav-item" data-view="presupuesto"><span class="nav-ico">🗓️</span><span>Presupuesto</span></button>
        <button class="nav-item" data-view="gastos"><span class="nav-ico">🧾</span><span>Gastos</span></button>
        <button class="nav-item" data-view="prestamos"><span class="nav-ico">🏦</span><span>Préstamos</span><span class="nav-badge" id="navPrestamosBadge" hidden></span></button>
        <button class="nav-item" data-view="cobros"><span class="nav-ico">📦</span><span id="navCobrosLabel">Priscila</span><span class="nav-badge" id="navCobrosBadge" hidden></span></button>
        <button class="nav-item" data-view="ajustes"><span class="nav-ico">⚙️</span><span>Ajustes</span></button>
      </nav>
      <div class="sidebar-foot">
        <button class="btn btn-primary btn-block" id="sideAddExpense">＋ Registrar gasto</button>
        <div class="hint">Atajo: tecla <kbd>N</kbd></div>
      </div>
    </aside>

    <!-- Contenido -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 class="page-title" id="pageTitle">Resumen</h1>
          <div class="page-sub" id="pageSub"></div>
        </div>
        <div class="month-picker">
          <button class="icon-btn" id="prevMonth" title="Mes anterior">‹</button>
          <button class="month-label" id="monthLabel" title="Ir al mes actual">—</button>
          <button class="icon-btn" id="nextMonth" title="Mes siguiente">›</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- Botón flotante (móvil) -->
  <button class="fab" id="fab" title="Registrar gasto">＋</button>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle">—</h3>
        <button class="icon-btn" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <!-- Pantalla de acceso privado (solo se activa cuando Firebase está configurado) -->
  <div class="auth-gate" id="authGate" hidden>
    <div class="auth-card">
      <div class="brand-logo auth-logo">💰</div>
      <h2>Mi Presupuesto</h2>
      <p class="muted">Acceso privado familiar. Inicia sesión con tu cuenta de Google autorizada.</p>
      <div class="alert alert-danger" id="authGateMsg" hidden></div>
      <button class="btn btn-primary btn-block" id="authSignInBtn">🔐 Entrar con Google</button>
      <div class="muted small" style="margin-top:12px">Solo cuentas autorizadas por Nehemías y Susan</div>
    </div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=5"></script>
  <script src="js/cloud.js?v=5"></script>
  <script src="js/store.js?v=5"></script>
  <script src="js/charts.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
